[package]
name = "sensorium-transform"
version = "0.5.2"
edition = "2021"
rust-version = "1.96"
license = "MIT"
description = "The sensorium Rust recorder's source transformer: entry guards, exit operands, err-flow probes, spawn sites and, under a focus, per-statement LINE probes, spliced into the original bytes at syn's offsets without moving a line."
repository = "https://github.com/bricelancasterwcp-sudo/sensorium"
homepage = "https://github.com/bricelancasterwcp-sudo/sensorium"
documentation = "https://docs.rs/sensorium-transform"
readme = "README.md"
keywords = ["tracing", "debugging", "testing", "instrumentation"]
categories = ["development-tools", "development-tools::debugging"]
# The census binary under src/bin is an acceptance instrument, not a published
# command. `include` keeps goldens and that binary out of the crates.io
# tarball; local `cargo test` still auto-discovers it.
include = [
    "src/*.rs",
    "src/lines/**",
    "src/visit/**",
    "README.md",
]

[dependencies]
# The repository's one sha256 (`Focus::focus_hash`). The runtime crate is the
# leaf -- zero dependencies -- so it is the only crate here both this one and
# `cargo-sensorium` can depend on; nothing of the runtime is linked into a
# transformed unit by this, the transformer only HASHES with it.
sensorium-rt = { path = "../sensorium-rt", version = "0.7.3" }
# `span-locations` is what makes `Span::byte_range()` and `Span::start()` exist
# outside a proc-macro context. Without it the transformer has no offsets and
# no line numbers, so it is not optional.
proc-macro2 = { version = "1.0.80", features = ["span-locations"] }
# `printing` is a DEFAULT feature and is load-bearing here: `syn::spanned::Spanned`
# only exists with it, and every operand's byte range is read through it.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The same `unicode-width` rustc_span 1.96 uses to print `Location::column()`.
# Widths are computed here and stored as numbers; `sensorium-rt` stays
# dependency-free and only subtracts them.
unicode-width = "=0.2.2"

[dev-dependencies]
# The tests re-parse what the transformer emitted with an INDEPENDENT call, so
# a result that only round-trips through our own visitor cannot pass; and they
# read the manifest back as JSON rather than trusting its Rust shape.
syn = { version = "2", features = ["full", "parsing"] }
serde_json = "1"
