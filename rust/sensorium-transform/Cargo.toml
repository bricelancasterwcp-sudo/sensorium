[package]
name = "sensorium-transform"
version = "0.3.1"
edition = "2021"
publish = false
description = "The sensorium Rust recorder's source transformer: entry guards, exit operands, err-flow probes and spawn sites spliced into the original bytes at syn's offsets, without moving a line."

[dependencies]
# `span-locations` is what makes `Span::byte_range()` and `Span::start()` exist
# outside a proc-macro context. Without it the transformer has no offsets and
# no line numbers, so it is not optional.
proc-macro2 = { version = "1.0.80", features = ["span-locations"] }
# `printing` is a DEFAULT feature and is load-bearing here: `syn::spanned::Spanned`
# only exists with it, and every operand's byte range is read through it.
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The tests re-parse what the transformer emitted with an INDEPENDENT call, so
# a result that only round-trips through our own visitor cannot pass; and they
# read the manifest back as JSON rather than trusting its Rust shape.
syn = { version = "2", features = ["full", "parsing"] }
serde_json = "1"
