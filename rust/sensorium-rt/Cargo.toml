[package]
name = "sensorium-rt"
version = "0.1.0"
edition = "2021"
publish = false
description = "The sensorium Rust recorder's runtime: per-thread MAP_SHARED trace spools, the entry guard, outcomes and capped return values."

# ZERO DEPENDENCIES, on purpose. The driver compiles this crate with one bare
# `rustc --crate-type rlib --edition 2021 -C opt-level=3 src/lib.rs` invocation
# and links it into a target build with `--extern sensorium_rt=<rlib>` and no
# `-L dependency` (plan decision D1), so anything this crate needs from libc is
# declared here as `extern "C"` -- see `src/ffi.rs`.
[dependencies]

[features]
# Hooks that exist ONLY so a test can drive a path the outside world cannot
# reach on demand. Never enabled in a production build: the driver's bare
# `rustc` line passes no `--cfg feature="test-hooks"`.
test-hooks = []
