[package]
name = "probe-core"
version = "0.1.0"
edition = "2021"
publish = false
description = "THROWAWAY SPIKE CODE (rung-1 Rust mechanics spike): the probe workspace's leaf library."

# The package is `probe-core`, not `core`: a lib TARGET named `core` collides
# with the sysroot crate of that name and the unit would not build at all.
[lib]
name = "probe_core"
path = "src/lib.rs"
