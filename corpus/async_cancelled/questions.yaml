program: main.py
questions:
  - id: did-b-finish
    ask: The total is 4, not 6. Did task-B's second step ever run?
    truth: >
      No. task-B's group holds the unframed worker call and exactly one
      step (n=1); the only step(n=2) in the trace ran in task-A's group.
      Two tasks appended 1 and one task appended 2, which is the whole of
      the missing 2 in the total.
    why_logs_fail: >
      No print site in this program names the task. A print in
      step gives 1, 1 and 2: a second step ran and none of the three lines
      says whose. A print at the end of worker fires once, and the two
      workers take no arguments at all, so that line cannot name which of
      them reached it. main's handler learns only that b ended cancelled,
      which main already knew, having called b.cancel() itself. The only
      print that would answer this calls asyncio.current_task() inside the
      helper -- the instrumentation nobody adds until they already suspect
      the answer, which is the thing being asked.
    command: ["tree", "$RUN"]
    expect_line:
      - ["task t3: task-B"]
      - ["worker()", "[coroutine, unframed]"]
    expect_count: {"step(n=1)": 2, "step(n=2)": 1}
  - id: whose-second-step-was-it
    ask: >
      Exactly one second step ran. Which task did it belong to -- the one
      that was cancelled, or the other?
    truth: >
      The third step activation is the only n=2, and its frame belongs to
      task t2 (task-A), at depth 0 because its caller -- the coroutine
      worker -- opened no frame. task-B never reached its second step.
    why_logs_fail: >
      Ordering a print by hand gives 1, 1, 2 in that order, which tells you
      a second step ran third and nothing about which task ran it; the two
      first steps are identical lines, so even counting them cannot label
      the third. A print at the end of worker is no better: the workers are
      identical, take no arguments, and close over nothing that differs.
      Task membership is not in any value either function receives.
    command: ["frame", "$RUN", "--fn", "step", "--nth", "3"]
    expect_line:
      - ["step", "task t2 (task-A)", "depth 0"]
      - ["args:", "n=2"]
  - id: where-was-b-when-cancelled
    ask: >
      Where was task-B suspended when the cancellation reached it -- at
      which line was it parked?
    truth: >
      It had started and had done step 1 (its group holds a step(n=1)), and
      it was parked at `await GATE.wait()` on line 29: the trace holds a
      RAISE of CancelledError inside `worker` at L29, which is the
      suspension point the cancellation was delivered to. `worker` opens no
      frame, so no disposition is claimed for that raise -- the location is
      the answer, not a verdict about handling.
    why_logs_fail: >
      The cancellation is delivered at a suspension point inside the
      coroutine and travels back out through it without touching any user
      `except`, so no print the program could contain fires at that line.
      main's handler fires, but it learns only that b ended cancelled --
      not where b was standing when it happened, which is a different fact
      and the one being asked. Naming the suspension point from prints
      means bracketing every await with a pair of them, which is exactly
      the instrumentation this tool exists to make unnecessary.
    command: ["exceptions", "$RUN"]
    expect_line:
      - ["RAISE", "worker", "CancelledError", "L29"]
