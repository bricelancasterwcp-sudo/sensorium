program: main.py
questions:
  - id: did-b-finish
    ask: The total is 4, not 6. Did task-B's second step ever run?
    truth: >
      No. task-B's group holds the unframed worker call and exactly one
      step (n=1); the only step(n=2) in the trace ran in task-A's group.
      Two tasks appended 1 and one task appended 2, which is the whole of
      the missing 2 in the total.
    why_logs_fail: >
      A print inside step gives 1, 1 and 2 -- three lines that say a second
      step ran, and not one of them says whose. The helper is handed a
      number and nothing else, so which task each append belongs to is a
      fact about the execution that never enters the helper's scope.
    command: ["tree", "$RUN"]
    expect_line:
      - ["task t3: task-B"]
      - ["worker(delay=10)", "[coroutine, unframed]"]
    expect_count: {"step(n=1)": 2, "step(n=2)": 1}
  - id: whose-second-step-was-it
    ask: >
      Exactly one second step ran. Which task did it belong to -- the one
      that was cancelled, or the other?
    truth: >
      The third step activation is the only n=2, and its frame belongs to
      task t2 (task-A), at depth 0 because its caller -- the coroutine
      worker -- opened no frame. task-B never reached its second step.
    why_logs_fail: >
      Ordering a print by hand gives 1, 1, 2 in that order, which tells you
      a second step ran third and nothing about which task ran it; the two
      first steps are identical lines, so even counting them cannot label
      the third. Task membership is not in any value the helper receives.
    command: ["frame", "$RUN", "--fn", "step", "--nth", "3"]
    expect_line:
      - ["step", "task t2 (task-A)", "depth 0"]
      - ["args:", "n=2"]
  - id: was-b-stopped-or-just-never-resumed
    ask: >
      task-B ran its first step and never its second. Was it stopped by
      something, or just never resumed before the program ended?
    truth: >
      It was stopped: cancellation was delivered into the awaited sleep,
      and the trace holds a RAISE of CancelledError inside `worker`.
      `worker` is a coroutine and opens no frame, so no disposition is
      claimed for that raise -- but the RAISE itself is evidence that
      something ended the task, which is more than the absence of a second
      step can say.
    why_logs_fail: >
      CancelledError is delivered into the await and never reaches a user
      `except` inside worker, so no print there fires for it: the
      end-of-worker line is simply missing, and it is missing identically
      whether the task was cancelled, was still suspended when the loop
      shut down, or died some other way. A missing line carries no cause.
    command: ["exceptions", "$RUN"]
    expect_line:
      - ["RAISE", "worker", "CancelledError"]
