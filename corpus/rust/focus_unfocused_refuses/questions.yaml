program: cargo
cargo_args: ["run"]
questions:
  - id: what-was-the-key-at-the-lookup
    ask: >
      The upgraded record is still billed the basic price. What was the
      value of `key` at the cache lookup on each of the two calls?
    truth: >
      A local variable at a line is not something THIS recording holds, and
      the reason is now a choice rather than a limit: the driver can produce
      LINE events, but only for functions named by `--focus`, and this run
      named none. So the trace declares `line=no`, produces no LINE events,
      and `watch` refuses rather than evaluating an expression against
      nothing. The refusal names the capability and says nothing was
      checked; exit status 3 -- what is missing is LINE capture in the
      recording, not a flag in the command. A tool that answered "0 hits"
      here would be reporting an absent record as a zero, and a tool that
      answered from the focused sibling cases would be reporting another
      run's record as this one's.
    why_logs_fail: >
      A `dbg!(&key)` would answer this, which is why the question is asked
      here: the honest failure to pin is the TOOL's. The fact under test is
      that a driver which CAN record locals still says it did not, on a run
      where it did not -- the difference between "the key never changed" and
      "I could not check". `rust/focus_let_chain` is the same command
      answering, on a run that asked for it.
    command: ["watch", "$RUN", "--at", "price_of", "--expr", "key == \"A1\""]
    expect_exit: 3
    # Re-pinned 2026-09-08 (queue buttoned up): 0.4.0 -> 0.4.1, because
    # `sensorium-rt` now owns the repository's only sha256 as a `pub mod`
    # and its declared identity moved with the crate. Neither the wire nor
    # what is recorded changed -- only the recorder's name in the sentence.
    expect_contains:
      - "REFUSED: watch needs line, which recorder sensorium-rt 0.4.1 declares it does not produce (capabilities.line: false); nothing was checked"
    expect_absent: ["hits:", "near-miss", "verdict:"]
  - id: does-an-unfocused-run-claim-a-focus
    ask: >
      This driver records LINE events for other runs. Does this trace claim
      any of that for itself?
    truth: >
      No, and both halves of the declaration say so. `focus: -` is the
      invocation's own list, empty -- design amendment A9 makes `meta.focus`
      the list the driver handed the converter and never a value read back
      out of a manifest, which matters because focused artifacts accumulate
      in a shared target directory (A8) and an earlier focused build's
      manifest would otherwise label this run `focus: ["price_of"]`. The
      trace's meta carries no `focus` key at all; the `-` is `info`'s
      rendering of its absence, the same one it prints for `window`.
      Capabilities read `line=no locals=no` and the tally `LINE 0`, which is
      §2.4's rule: true only when some unit of THIS run carries a LINE site.
    why_logs_fail: >
      A `dbg!` says nothing about which functions were instrumented, and
      RUST_LOG has no logger to reach in this crate, so a reader of a log
      cannot tell an uninstrumented function from one that never ran. This is
      the counterfactual for the whole focus tier: the same driver, the same
      crate shape, one flag apart, and the trace is the thing that has to
      tell them apart -- exactly as a missing `dbg!` cannot.
    command: ["info", "$RUN"]
    expect_contains:
      - "LINE 0"
    expect_line:
      - ["focus: -", "window: -"]
      - ["capabilities:", "line=no locals=no"]
    expect_absent: ["line=yes", "locals=yes"]
