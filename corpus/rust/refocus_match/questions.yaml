program: cargo
cargo_args: ["run"]
questions:
  - id: does-the-rerun-under-a-deeper-focus-match-the-run-it-came-from
    ask: >
      This recording holds no LINE row at all, so the per-statement question
      cannot be asked of it. `refocus` re-runs the same crate one flag
      deeper. Is the trace that comes back the SAME execution, and what is
      the verdict licensed to claim?
    truth: >
      MATCH, exit 0, with the licence GRANTED over exactly four points.
      Derived before it was measured: design 2026-09-07 §3.1 -- the
      comparator is `diff_cmd.compare` unchanged and the fingerprint covers
      CALL/RETURN/RAISE/HANDLED only, so the re-run's four LINE rows cannot
      move it and a deterministic program MATCHes. §3.2 gives the licence
      its shape: source, environment and exit status run for real (three
      checks that pass here), while `output` and `children` are UNVERIFIABLE
      -- the recorder declares `capabilities.output: false` and
      `capabilities.children: false`, so the check cannot run at all. Those
      two are the named bug class: compared anyway they would read as two
      empty sets AGREEING. They are printed and stamped as checks that could
      not run, and they do NOT withhold the licence, which is why `licence:
      WITHHELD` must be absent. The blind-spot block is the Rust vocabulary's
      (§3.2, `vocab.RUST.refocus_blind_spots`), and its third line is the one
      only a re-run can owe: the rebuild is its own cost. The announced
      command is §2.3's rule spelled out: `--refocus-of <original>` first and
      unconditional, then the ORIGINAL's recorded tier (`--tier call`, never
      one this command asserts), then the merged focus, then cargo's own
      argv -- so a refocus only ever captures more.
    why_logs_fail: >
      A `dbg!` cannot be added retroactively to a run that already happened,
      which is the whole shape of this case: the original was recorded at
      tier call, the question arrived afterwards, and re-running the program
      by hand with a `dbg!` in it produces a SECOND execution nobody has
      checked against the first. RUST_LOG has no logger to reach in this
      crate and nothing panics, so RUST_BACKTRACE prints nothing either; and
      neither of them would say whether the run that printed the value took
      the same path as the run that raised the question.
    command: ["refocus", "$RUN", "--focus", "fill"]
    expect_contains:
      - "refocus verdict: MATCH -- every recorded thread produced the identical CALL/RETURN/RAISE/HANDLED sequence"
      - "checks that could not run on this pair"
      - "output: unverifiable (not recorded)"
      - "children: unverifiable (not witnessed)"
      - "output not recorded (capabilities.output: false)"
      - "threads from dependency code are unnamed"
      - "the re-run's rebuild is its own cost: --focus keys a fresh shim and a rebuild of the matched units"
      - "no thread started besides the main one as OS threads (libtest's per-test threads and threads spawned by workspace code), and none left running when recording stopped"
    expect_line:
      - ["refocus-of: $RUN", "--refocus-of $RUN", "--tier call", "--focus fill"]
      - ["licence: verified against $RUN on exactly these points, and no others:"]
    expect_absent: ["licence: WITHHELD"]
    expect_exit: 0
  - id: does-the-store-hold-the-pair-and-say-which-came-from-which
    ask: >
      Two traces are now in this store. Does the listing say the second is a
      refocus of the first, and how much does it claim for it?
    truth: >
      Yes, and it claims a counted licence, never a bare pedigree. The link
      is `refocus_of`, stamped into the new trace by the driver's
      `--refocus-of` (design 2026-09-07 §2.1/§2.2, ruling G3: the pair is
      found in the STORE, never parsed out of the driver's `run:` lines), so
      the row reads `refocus-of:<original>` with `verdict:MATCH` beside it
      and `(granted:4,see-info)` after that -- the four verified points of
      the question above, counted, with `info` named as the place they are
      written out. Each trace also carries its own `invocation`, so the two
      appear under two `cargo run` headers: the re-run is a second
      invocation of the same command, not a second process of the first.
    why_logs_fail: >
      No `dbg!` and no RUST_LOG line can state a relationship between two
      executions, because a log line is written by one of them and knows
      nothing of the other; RUST_BACKTRACE is narrower still and prints only
      on a panic. The fact under test here is not a value the program held
      but a durable link between two recordings, together with the bounded
      count of what the comparison actually verified.
    command: ["runs"]
    depends_on: does-the-rerun-under-a-deeper-focus-match-the-run-it-came-from
    expect_line:
      - ["refocus-of:$RUN", "verdict:MATCH(granted:4,see-info)"]
    expect_count: {"invocation ": 2}
    expect_exit: 0
  - id: what-does-the-new-trace-declare-about-its-own-depth-and-pedigree
    ask: >
      A reader who did not launch the refocus opens the newest trace. Does
      it say what it was focused on, that it holds line-level records, and
      which run it is a re-run of?
    truth: >
      All three, from the trace itself. `focus: fill` is the invocation's own
      list (rung-4 slice 1, amendment A9) and `line=yes locals=yes` is the
      recorder's statement that some unit carries a LINE site; `LINE 4` in
      the tally is the four rows -- one parameters row plus one per completed
      statement, and none for the tail (slice 1 §3.1/A2), the same count
      `rust/focus_let_chain` pins on this shape. `refocus-of: $RUN  verdict:
      MATCH  licence: granted` is the stamp design 2026-09-07 §3.1 writes
      into the NEW trace's meta through `db.set_meta`, which is what makes
      the verdict outlive the terminal it was printed in. `last` names that
      trace because it is the store's newest by MTIME and this case's store
      holds exactly two traces, the second written by the refocus above --
      unambiguous inside a case with exactly two traces, and not a general
      way to name a re-run.
    why_logs_fail: >
      A `dbg!` states a value and never the depth at which the run was
      recorded, so it cannot tell a later reader whether an absent per-line
      answer means the statement did not run or the recording never held
      lines; on the unfocused original of this very case the capability reads
      `line=no`. RUST_LOG levels are a property of a logger this crate does
      not have, and RUST_BACKTRACE only ever fires on a panic, so neither
      records a pedigree either.
    command: ["info", "last"]
    depends_on: does-the-rerun-under-a-deeper-focus-match-the-run-it-came-from
    expect_contains:
      - "line=yes locals=yes"
      - "LINE 4"
    expect_line:
      - ["focus: fill", "window: -"]
      - ["refocus-of: $RUN", "verdict: MATCH", "licence: granted"]
    expect_exit: 0
  - id: what-was-b-when-the-statement-wrote-it-in-the-rerun
    ask: >
      The question that could not be asked of the original: what was the
      local `b` at the statement that wrote it?
    truth: >
      2, at `main.rs:12` -- the `let b = a + 1;` statement -- and the loop is
      closed: the answer comes from the re-run, and the MATCH above is what
      says the re-run took the same path as the run that was asked about
      (design 2026-09-07 §3.4). SATISFIED at 2 of the 2 evaluable sites, with
      the 3 it could not evaluate stated beside them: the activation's CALL
      row, the parameters LINE and the `let a` LINE, at none of which `b` is
      bound yet. `verdict: SATISFIED` and exit 0 are `watch`'s own words
      (slice-1 amendment A4); the 3 unevaluable sites are reported rather
      than folded into the hit count, because "hits: 2" alone would claim the
      predicate held throughout the frame. `last` is again the refocused
      trace, unambiguous inside a case with exactly two traces.
    why_logs_fail: >
      A `dbg!(&b)` on line 12 would print this value -- of a THIRD execution,
      run later, by hand, after an edit and a rebuild, and with the line and
      the name guessed in advance. What this case pins is that the value came
      out of a re-run whose call shape was verified against the original, so
      the number is about the run that raised the question. RUST_LOG reaches
      no logger here and nothing panics, so RUST_BACKTRACE never prints.
    command: ["watch", "last", "--at", "fill", "--expr", "b == 2"]
    depends_on: does-the-rerun-under-a-deeper-focus-match-the-run-it-came-from
    expect_contains:
      - "verdict: SATISFIED at 2 of the 2 site(s) the predicate could be evaluated at"
      - "but 3 of 5 recorded site(s) could NOT be evaluated"
    expect_line:
      - ["HIT", "LINE", "fill L12", "b=2"]
    expect_exit: 0
