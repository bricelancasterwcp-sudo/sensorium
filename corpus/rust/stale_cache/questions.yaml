program: cargo
cargo_args: ["run"]
questions:
  - id: what-was-the-key-at-the-lookup
    ask: >
      The upgraded record is still billed the basic price. What was the
      value of `key` at the cache lookup on each of the two calls?
    truth: >
      A local variable at a line is not something this recording holds:
      the recorder declares line=no, produces no LINE events, and `watch`
      therefore refuses rather than evaluating an expression against
      nothing. The refusal names the capability and says nothing was
      checked; exit status 3 -- what is missing is LINE capture in the
      recording, not a flag in the command. A tool that answered "0 hits"
      here would be reporting an absent record as a zero.
    why_logs_fail: >
      This is the one question in this case a `dbg!(&key)` really would
      answer, which is why it is asked: the honest failure to pin is the
      TOOL's, not the log's. What matters is that the tool says it cannot
      see the value rather than producing a hit count from a recording with
      no line-level events in it -- the difference between "the key never
      changed" and "I could not check".
    command: ["watch", "$RUN", "--at", "price_of", "--expr", "key == \"A1\""]
    # Site table (2026-09-04): `REFUSED: watch needs line` is 3 -- what
    # is missing is LINE capture in the recording, not a flag here.
    expect_exit: 3
    # Re-pinned 2026-09-12 (S5 rung 4's debts): 0.4.1 -> 0.5.0, because
    # `sensorium-rt` gained the LINE payload's fourth delta tag and the
    # `line_unbinding` entry point that writes it. This case is recorded
    # WITHOUT a `--focus`, so it still declares `line: false` and the refusal
    # is still 3; only the recorder's name in the sentence moved.
    # Re-pinned 2026-09-08 (queue buttoned up): 0.4.0 -> 0.4.1, because
    # `sensorium-rt` now owns the repository's only sha256 as a `pub mod`
    # and its declared identity moved with the crate. Neither the wire nor
    # what is recorded changed -- only the recorder's name in the sentence.
    # Re-pinned 2026-09-06 (rung 4): 0.3.0 -> 0.4.0, because the runtime
    # shipped wire kind LINE. This case is recorded WITHOUT a `--focus`, so
    # it still declares `line: false` and the refusal is still 3; only the
    # recorder's name in the sentence moved. (Re-pinned 2026-09-04, rung 3:
    # 0.1.0 -> 0.3.0 for wire v3 and err_flow, design R13.)
    expect_contains:
    # Re-pinned 2026-09-14 (secrets redaction PR B, task 6): 0.6.0 -> 0.7.0,
    # because `sensorium-rt` 0.7.0 writes wire v4 -- a LINE delta whose name
    # fires rule v1 is written REDACTED, digest and all -- and the driver moved
    # with it (`cargo-sensorium` 0.8.0, which reads v4). This case records
    # WITHOUT a `--focus`, so it still produces no LINE events at all and the
    # refusal is still 3; only the recorder's name in the sentence moved.
    # Re-pinned 2026-09-14 (secrets redaction PR A shipped red): 0.5.0 -> 0.6.0,
    # because `sensorium-rt` 0.6.0 redacts its environment in the proc header
    # and the refusal's only moving part is the recorder's own name. The
    # local corpus run that called PR A green recorded through a STALE
    # driver on PATH, which embeds the runtime it was built with; CI builds
    # the driver fresh and read 0.6.0 (run 34840430230).
      - "REFUSED: watch needs line, which recorder sensorium-rt 0.7.0 declares it does not produce (capabilities.line: false); nothing was checked"
    expect_absent: ["hits:", "near-miss", "verdict:"]
  - id: did-the-key-move-with-the-record
    ask: >
      The record's tier changed between the two lookups. Did the cache key
      change with it?
    truth: >
      No. memo_id ran twice and returned "A1" both times, because it reads
      only the sku, while upgrade returned "pro" in between -- so the second
      price_of hit the memo entry inserted for the basic tier and returned
      10.0 for a record that is no longer basic. Two identical keys spanning
      a change of tier is the whole bug, and the return values carry it
      without needing a single local variable.
    why_logs_fail: >
      The key is an internal String that is never printed, and it is
      identical on both calls, so even a log of it would look correct in
      isolation; the fault is only visible as "identical key, changed
      record", which needs both halves at once and in order. RUST_LOG has
      no logger to reach in this crate, and nothing panics, so
      RUST_BACKTRACE never prints.
    command: ["grep", "$RUN", "--kind", "RETURN", "\""]
    expect_contains: ["matches: 3"]
    expect_count: {"memo_id -> \"A1\"": 2}
    expect_line:
      - ["RETURN", "upgrade -> \"pro\""]
