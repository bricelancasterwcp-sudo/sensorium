program: vitest
harness_args: ["run", "silent_swallow"]
questions:
  - id: what-happened-to-the-parse-error
    ask: >
      The config file could not be parsed and the caller got a config
      anyway. What happened to the error?
    truth: >
      It was caught and dropped, and this recorder now says so: SWALLOWED,
      naming the `catch` clause that took it, the frame that then returned
      a healthy-looking default, and the throw it never let past. The
      binding `e` is bound and used nowhere, so the transform recorded the
      clause as `catch` -- had the clause returned or stored `e`, the same
      rows would read AMBIGUOUS instead, which is the line these rules
      refuse to cross. Before these rules existed this question was
      answered with a REFUSAL at exit 3; the refusal no recording can
      produce any more lives on as
      `v32-err-flow-typescript-capability-refusal`, on a 0.1.x-shaped
      trace.
    why_logs_fail: >
      An empty `catch` is exactly the shape that prints nothing: the whole
      point of the bug is that the failure reaches no channel. A
      `console.log` in the `catch` would answer it and is what is missing --
      and adding it requires already suspecting this `catch`, of which a
      real codebase has hundreds. `DEBUG=*` enables loggers, and no logger
      was called. A stack trace would have been printed if the error had
      escaped, and it did not.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["SWALLOWED -- caught by catch at e5 (loadConfig L19) in f2, which
          returned"]
      - ["dispositions: swallowed 1"]
  - id: are-the-rows-there-at-all
    ask: >
      Is the refusal because nothing was recorded, or because nothing can be
      judged?
    truth: >
      Because nothing can be judged -- not because nothing was recorded,
      and, as of `sensorium-ts` 0.2.0, not because nothing was declared
      either. This trace holds one RAISE and one HANDLED beside its three
      CALLs and two RETURNs -- the throw statement and the catch clause were
      both recorded -- and the recorder now declares `err_flow=yes`, its own
      statement that those rows carry what a disposition verdict needs.
      `exceptions` reads them by rule, and the capability is what says it
      may: a recording whose `err_flow` is `no` is refused before any rule
      touches an event, because the capability and the rule are two
      different things and only the recorder can speak for the first.
    why_logs_fail: >
      This is a question about the instrument, not the program, and all
      three channels answer about the program. A `console.log` says what the
      code did, never whether the tool that read it holds the rules to judge
      it -- and here the honest reading of NO log line is ambiguous between
      "the catch is empty" and "nobody recorded it". `DEBUG=*` enables
      loggers, and an empty `catch` calls none. A stack trace is printed
      when an error escapes, and this one did not escape, so its absence
      likewise says nothing about what was recorded.
    command: ["info", "$RUN"]
    expect_line:
      - ["recorded: CALL 3", "RETURN 2", "RAISE 1", "HANDLED 1"]
      - ["capabilities:", "err_flow=yes"]
      - ["recorder: sensorium-ts 0.2.0", "lang: typescript"]
  - id: what-does-the-trace-show-happened
    ask: >
      Without a verdict, what does the recording show about that call?
    truth: >
      That `parse` left by throwing -- `!! Error('not a number: nine')` --
      while `loadConfig`, the frame directly above it, closed normally and
      returned `{ retries: 3 }`. A frame that unwound under a frame that
      returned is the swallow's shape, drawn without being named: the
      recording carries it and the verdict is what is owed. The test passes,
      so nothing else in the run marks the failure at all.
    why_logs_fail: >
      The program's own output is a passing test and a config object;
      the shape that matters -- one frame unwinding inside another that
      returned -- is a relationship between two frames, and a
      `console.log` line lives inside one. `DEBUG=*` has no logger to
      enable, because an empty `catch` calls none. No stack trace is
      produced, because the error never escaped the `catch`.
    command: ["tree", "$RUN"]
    expect_line:
      - ["parse() <unread: locals> !! Error('not a number: nine')"]
      - ["loadConfig() <unread: locals> -> { retries: 3 }"]
    expect_contains: ["task t1: a config file is loaded"]
