program: vitest
harness_args: ["run", "rethrow_hop"]
questions:
  - id: where-did-the-outage-go-through-two-clauses
    ask: >
      The boot fell back to defaults. The disk failure passed through two
      `catch` clauses on its way there -- what became of it, and where did
      it stop?
    truth: >
      One thrown object, two RAISE rows, two blocks -- and the tool keeps
      them separate on purpose: the origin at e5 says RE-RAISED and points
      at what became of the LAST raise, and the `hops:` line draws the whole
      journey (`e5 (load L7) -> e7 (reload L14)`). The second block is the
      verdict on the failure itself, and it is AMBIGUOUS rather than the
      swallow a reader can see in the source. The reason is the middle
      clause: `catch (e) { throw e }` MENTIONS its binding outside a logging
      call, so the transform wrote `catch_escaped`, and one escaping handler
      anywhere for a serial keeps every row of that serial out of SWALLOWED.
      The outer `catch { return 'defaults' }` really did absorb it -- and
      this recorder declines to say so, because by its own escape rule the
      value had already left a handler once. A rethrow clause is always
      escaping under that rule, so no `throw e` hop can end in SWALLOWED.
    why_logs_fail: >
      A `console.log` in either clause prints one error twice and leaves the
      reader to guess whether those two lines are one object or two failures
      -- which is precisely the question the `hops:` line answers with an
      identity the log has no way to carry. `DEBUG=*` enables namespaced
      loggers and this program registers none. A stack trace would name
      frames, and the rethrow throws the ORIGINAL object, whose stack still
      points at `load` and says nothing about `reload` having handled and
      re-raised it; no stack trace is printed at all here, because the outer
      clause caught it and nothing escaped to the harness.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["e5 RAISE", "load raise Error('disk offline') L7"]
      - ["RE-RAISED -- raised again at e7 (reload L14) → ambiguous"]
      - ["hops: e5 (load L7) → e7 (reload L14)"]
      - ["e7 RAISE", "reload raise Error('disk offline') L14"]
      - ["AMBIGUOUS -- caught at e6 (catch_escaped), and the error or a
          rendering of it left the handler; not followed"]
      - ["dispositions: re-raised 1, ambiguous 1"]
