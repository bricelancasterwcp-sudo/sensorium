program: vitest
harness_args: ["run", "translated"]
questions:
  - id: what-became-of-the-original-decode-failure
    ask: >
      The caller received a `Wrapped`. What became of the ORIGINAL decode
      failure it was built from?
    truth: >
      Not the same question as what became of the wrapper, and the tool
      keeps them apart: two thrown objects, two serials, two blocks. The
      original's block is AMBIGUOUS -- the clause read its binding to build
      the wrapper's message, so the error or a rendering of it left the
      handler and the rule does not follow where. The wrapper's own raise at
      e7 is judged on its own evidence too, and rung 3 names what rung 2
      could only fold into the catch-all: AMBIGUOUS, untraced catcher --
      `caught by untraced code inside <anonymous> (translated.test.ts): f2
      unwound, its caller f1 returned; not followed`. It unwound
      `decodeOrWrap`, and f2 -- the arrow `expect(() => …)` calls -- unwound
      with it; the frame that then decided the assertion is f1, the test
      callback itself, and it is traced code that DID return, which is
      exactly the footprint the untraced-catcher rule reads and the reason
      line now states by name. There is still no handler row anywhere in
      the recording for this serial, the outermost frame it left is not a
      task root, and PROPAGATED -- which would claim the failure left the
      traced world -- is still not established: naming the footprint is
      not claiming more evidence than the recording holds, only reading
      what was always there more precisely than a bare catch-all could. A
      tool that folded the two objects into one story would still be wrong
      twice over: the original stopped at e6 under its own reason
      (`escaped`), and the wrapper's reason (`untraced catcher`) is not the
      original's.
    why_logs_fail: >
      A `console.log` of the wrapper prints a message built out of the
      original's, which is exactly the confusion the case is about: the
      TEXT survives the translation and the IDENTITY does not, and no log
      line distinguishes "the same failure, renamed" from "a second failure
      that quotes the first". `DEBUG=*` enables namespaced loggers this
      program never registers. A stack trace of the wrapper starts at the
      `throw new Wrapped` line -- the original's frames are gone from it,
      because a new Error captures a new stack, which is the single most
      common way a translation costs a reader the site that mattered.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["e5 RAISE", "decode raise Error('bad payload: {') L10"]
      - ["AMBIGUOUS -- caught at e6 (catch_escaped), and the error or a
          rendering of it left the handler; not followed"]
      - ["e7 RAISE", "decodeOrWrap raise Wrapped('Error: bad payload: {')
          L17"]
      - ["AMBIGUOUS -- caught by untraced code inside <anonymous>
          (translated.test.ts): f2 unwound, its caller f1 returned; not
          followed"]
      - ["dispositions: ambiguous 2"]
      - ["ambiguous by reason: escaped 1, untraced catcher 1"]
    expect_absent: ["SWALLOWED", "no rule of this recorder"]
