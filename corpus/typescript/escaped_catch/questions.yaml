program: vitest
harness_args: ["run", "escaped_catch"]
questions:
  - id: was-the-amount-failure-swallowed
    ask: >
      The amount could not be parsed and the receipt line was produced
      anyway. Was the failure swallowed?
    truth: >
      The recording does not establish that, and `exceptions` says so rather
      than guessing: AMBIGUOUS, because the clause read its binding and
      returned a rendering of it (`String(e)`), so the failure -- or a
      version of it -- left the handler. Where it went next is not on the
      wire: a caller may render it, may branch on it, may drop it. The rows
      are the same two a swallow leaves, one RAISE and one HANDLED; the only
      thing that differs is the `how` word the transform wrote from the
      clause's own body, and that word is the whole of what keeps this case
      out of the accusation the next one earns.
    why_logs_fail: >
      A `console.log` inside the `catch` would print the error and settle
      nothing, because the question is not what the value WAS but whether
      anything above this frame acted on it -- and the answer to that lives
      in code the log line cannot see. `DEBUG=*` enables namespaced loggers
      this program never registers. A stack trace is printed when an error
      escapes as an error, and this one escaped as a STRING, which is the
      exact transformation that costs a reader the trace: the return value
      carries the message and none of the frames.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["e4 RAISE", "parseAmount raise Error('not an amount: twelve') L10"]
      - ["AMBIGUOUS -- caught at e5 (catch_escaped), and the error or a
          rendering of it left the handler; not followed"]
      - ["dispositions: ambiguous 1"]
    expect_absent: ["SWALLOWED"]
