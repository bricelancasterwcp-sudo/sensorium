program: vitest
harness_args: ["run", "unhandled_rejection_in_info"]
questions:
  - id: did-anything-notice-the-rejection
    ask: >
      The test passed and the run is green. Did anything at all notice that
      the background refresh failed?
    truth: >
      One thing did: the container's own `unhandledRejection` listener, and
      `info` prints `unhandled rejections: 1`. Nothing else did -- the
      harness waited for vitest and got 0, vitest reported the file as
      passing, and the test's own assertion is about the cache and holds.
      The count is meta and not an event, because a rejection has no site to
      hang a causal event on and inventing one would put a place in the
      program that does not exist. On a complete trace this line prints even
      at zero, so a 1 here is a measured 1 and a 0 elsewhere is a measured 0.
    why_logs_fail: >
      There is nothing to log: no `catch` runs, no handler runs, and the
      failing function's caller discarded the promise with `void`. A
      `console.log` after `startRefresh()` prints happily, because the
      rejection has not happened yet -- it lands a microtask later. `DEBUG=*`
      switches loggers this program does not use. There is no stack trace,
      because nothing throws on any stack the program owns.
    command: ["info", "$RUN"]
    expect_contains: ["unhandled rejections: 1"]
    expect_line:
      - ["harness: npx vitest run unhandled_rejection_in_info",
         "exit: 0 (waited)"]
      - ["recorded: CALL 6", "RETURN 5", "RAISE 1", "HANDLED 0"]
  - id: where-did-the-failure-actually-happen
    ask: Where did the refresh fail, and what did its caller do about it?
    truth: >
      `refresh` left by throwing -- the frame closes `!! Error('stale
      token')` -- and `startRefresh`, the frame that called it, returned
      `undefined` a moment later as if nothing had happened, because it
      discarded the promise instead of awaiting it. The test callback then
      returned normally too. Every frame around the failure looks healthy,
      which is why the count in the previous question is the only thing in
      the run that marks it.
    why_logs_fail: >
      The failure is inside an async function whose result nobody reads, so
      the only place a `console.log` could go is inside `refresh` itself --
      before the `throw`, which is the edit you make after you already know
      this function is the problem; every other frame's output would be
      identical if the refresh had succeeded. `DEBUG=*` enables namespaced
      loggers and this code calls none, so it prints nothing at all. And no
      stack trace is printed, because the rejection is never delivered to a
      handler -- the one channel that would have named the throw site is
      exactly the one an unawaited promise suppresses.
    command: ["tree", "$RUN"]
    expect_line:
      - ["refresh() <unread: locals>", "[async]", "!! Error('stale token')"]
      - ["startRefresh() <unread: locals> -> undefined"]
      - ["cacheAge() <unread: locals> -> 0"]
    expect_contains: ["task t1: a background refresh is started"]
  - id: what-does-the-verdict-say-about-the-rejection
    ask: >
      `info` counted the rejection. What does the disposition command say
      became of it, and where was it raised?
    truth: >
      UNCAUGHT -- `unhandled rejection; raised at refresh L9`. This is the
      one disposition the tool takes from the PROCESS rather than from the
      rows: Node's own `unhandledRejection` listener is what establishes
      that nobody received it, and the recorder's rows are what supply the
      site, so the verdict joins a fact the container knows to a place only
      the recording knows. The header repeats `unhandled rejections: 1` in
      the same words `info` uses -- a rejection no row carries would be
      counted there and judged nowhere, because it has no site and the
      recorder will not invent one.
    why_logs_fail: >
      There is nothing in the program to log: no `catch` runs, no handler
      runs, and `startRefresh` discarded the promise with `void`, so a
      `console.log` after it prints happily a microtask before the rejection
      lands. `DEBUG=*` enables namespaced loggers this program never
      registers. A stack trace is the one channel that CAN fire here --
      Node's unhandled-rejection warning carries one -- but it names the
      throw and not the disposition, and it arrives on stderr detached from
      the passing test, which is why the run stayed green and nobody read
      it.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["unhandled rejections: 1"]
      - ["e4 RAISE", "refresh raise Error('stale token') L9"]
      - ["UNCAUGHT -- unhandled rejection; raised at refresh L9"]
      - ["dispositions: uncaught 1"]
    expect_absent: ["SWALLOWED"]
