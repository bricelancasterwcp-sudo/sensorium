program: vitest
harness_args: ["run", "secret_in_env"]
record: {focus: ["handle"]}
env: {SENSORIUM_CORPUS_TOKEN: tok_corpus_avndqWkv1AvWvvoS02hrMipSDXuyK}
questions:
  - id: info-counts-the-values-the-rule-took
    ask: >
      handle reads an API token via secret() and threads it through two
      more bindings. What does info say became of it?
    truth: >
      Redacted at every one of the four places rule v1 can reach it: the
      env line names SENSORIUM_CORPUS_TOKEN among the redacted variables,
      and the redaction line counts values redacted: 4 -- secret's RETURN
      (taken by the callee's own name, B7), the CALL argument token, the
      apiKey delta and the authHeaders delta (the whole object is taken,
      because its inspected text would otherwise print authorization's
      contents). handle fires on nothing itself, so its own name is not
      what is redacted -- the four values that passed through it are.
    why_logs_fail: >
      A console.log(token) at any of those bindings is exactly what this
      rule exists to stop -- it would put a live token in this trace's own
      stored output, in a case whose whole point is that the trace never
      holds it. DEBUG=* has no logger to enable here, and nothing throws,
      so no stack trace is produced either. The honest way to confirm the
      token never reached disk is to ask the tool what it redacted, not to
      log the value the rule is protecting.
    command: ["info", "$RUN"]
    expect_contains:
      - "SENSORIUM_CORPUS_TOKEN"
      - "values redacted: 4"
    expect_absent: ["tok_corpus_avndqWkv1AvWvvoS02hrMipSDXuyK"]

  - id: frame-renders-the-marker-not-the-token
    ask: >
      frame handle prints a timeline of its bindings. What does it print
      for the token this function is holding?
    truth: >
      A marker, token=<redacted #xxxxxxxx> -- eight hex characters of a
      digest keyed to this store, never the token itself. The digest lets
      two takings of the same value be told apart by eye without printing
      either; it is not pinned here because it is per-store and would
      differ on every recording.
    why_logs_fail: >
      A console.log(token) to check it against the planted value is the
      same act this trace refuses to commit to disk -- a log line here
      would hold the plaintext the recording does not. DEBUG=* has no
      logger to enable here, and nothing throws, so no stack trace exists
      to read a local out of.
    command: ["frame", "$RUN", "--fn", "handle"]
    expect_contains: ["token=<redacted #"]
    expect_absent: ["tok_corpus_avndqWkv1AvWvvoS02hrMipSDXuyK"]

  - id: watch-refuses-to-compare-a-redacted-name
    ask: >
      Would watch --expr "token == 'x'" at handle find the token equal to
      'x', or say it differs?
    truth: >
      Neither. The predicate touches only a name the rule took, so watch
      ends at NOTHING WAS CHECKED (exit 3) rather than deciding true or
      false about a value it does not hold, and the state line for token
      reads <redacted; no comparable value> rather than the marker's
      digest -- a state line is read by eye, and a digest there would be an
      offline guessing target for the value it stands for.
    why_logs_fail: >
      A console.log(token) at that line would answer the comparison
      directly, and getting it there is the leak this recorder exists to
      prevent. DEBUG=* has no logger to enable here, and nothing throws,
      so no stack trace exists either. The honest answer is that the
      recording cannot support the comparison at all, not that it silently
      ran one.
    command: ["watch", "$RUN", "--at", "handle", "--expr", "token == 'x'"]
    expect_exit: 3
    expect_contains:
      - "NOTHING WAS CHECKED"
      - "<redacted; no comparable value>"
    expect_absent: ["tok_corpus_avndqWkv1AvWvvoS02hrMipSDXuyK"]

  - id: flow-refuses-to-follow-a-redacted-argument
    ask: >
      handle(token) is passed the token as an argument. Can flow follow it
      as an object -- alias, copy, or otherwise?
    truth: >
      No. token at handle's CALL is a value rule v1 took by name, and a
      taken value keeps no identity to follow. flow --object refuses at
      exit 2 rather than minting a target from nothing, and names which
      rule did it and that the value is unreachable, not merely
      unrecorded.
    why_logs_fail: >
      A console.log(token) would print the string outright, which is the
      leak this case exists to show the tool refuses to reproduce. DEBUG=*
      has no logger to enable here, and nothing throws, so no stack trace
      would name an identity to follow either -- the point is that the
      tool says so up front, not after a value has already reached a
      terminal.
    command: ["flow", "$RUN", "--object", "handle:token"]
    expect_exit: 2
    expect_contains:
      - "is redacted (by name) and has no identity or value to follow"
    expect_absent: ["tok_corpus_avndqWkv1AvWvvoS02hrMipSDXuyK"]
