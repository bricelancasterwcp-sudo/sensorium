program: vitest
harness_args: ["run", "focus_place_write/"]
record: {focus: ["state.ts:bump"]}
questions:
  - id: did-the-write-statement-run
    ask: >
      `bump` returned 0 and the caller's object came back with `x` set to 5.
      Did the write statement run, and what did the recording see of it?
    truth: >
      It ran. There is a row at its line, `LINE bump L8`, and the row carries
      the member it wrote: `state.x=5`. The row above, `LINE bump L7
      seen=0`, is the local the function returns, still 0. The argument
      capture `state={ x: 0 }` is the object as it was on the way in and is
      not re-read, so the field write and the argument are two different
      facts. The bug is that `bump` returns `seen` and the caller reads
      `state.x`.
    why_logs_fail: >
      A `console.log(state)` after the write prints `{ x: 5 }`, which is a
      claim about the object and not about which statement changed it, and
      the object is shared, so any frame could have. `DEBUG=*` prints the
      same rendering through a namespaced channel. Nothing throws, so there
      is no stack trace, and a stack trace names the frames on the stack
      rather than the fields any of them assigned.
    command: ["frame", "$RUN", "--fn", "bump"]
    expect_exit: 0
    expect_contains:
      - "args: state={ x: 0 }"
      - "return: 0"
    expect_line:
      - ["LINE", "bump L7", "seen=0"]
      - ["LINE", "bump L8", "state.x=5"]
  - id: can-the-written-value-be-followed
    ask: >
      Then follow the 5 that was written. Where does it appear?
    truth: >
      On the write's own row, as the local `state.x`. One sighting. The
      search covers five captures across five events: the focused CALL's
      `state` argument (the object on the way in, `{ x: 0 }`, which is not
      a 5), the `seen=0` delta, the `state.x=5` delta, and the two RETURN
      values. `flow` exits 0. The argument capture is never re-read, so the
      mutated field is visible through the delta and not through the
      argument.
    why_logs_fail: >
      A `console.log(state.x)` at each line is the instrumentation this
      recording is standing in for, and it has to be written before the run
      you care about; the recording is what you have afterwards. `DEBUG=*`
      cannot name which statement wrote the field. Nothing throws, so no
      stack trace is produced, and a stack trace shows where execution is,
      never which value a field is holding.
    command: ["flow", "$RUN", "--value", "5"]
    expect_exit: 0
    expect_contains:
      - "sightings: 1 event(s), 1 capture(s)"
      - "scope: 5 capture(s) searched across 5 event(s) in CALL args, RETURN
         values and LINE local deltas"
    expect_line:
      - ["LINE", "bump L8", "state.x=5", "[local state.x]"]
