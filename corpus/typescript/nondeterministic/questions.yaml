program: vitest
harness_args: ["run", "nondeterministic"]
second_run:
  harness_args: ["run", "nondeterministic"]
questions:
  - id: is-the-second-recording-the-same-execution
    ask: >
      The same command was recorded twice. Can the second recording be read
      as evidence about the first?
    truth: >
      No, and the tool must say so rather than quietly hand back a second
      trace as if it described the first. This program's branch is decided
      by a counter file OUTSIDE the process, so the second invocation takes
      the other branch: the first called `left`, the second called `right`.
      Everything up to and including `pick` is identical -- both runs call
      `choose` and then `pick` -- and they part at the very next causal
      step, which is step 4. The verdict is DIVERGED and the exit status is
      1. A MATCH here would be the worst failure this command has.
    why_logs_fail: >
      Re-running with more logging is exactly what a log-based workflow
      does, and it is precisely what silently fails here: the second run is
      not the run you were debugging. Logs have no notion of "this output
      came from a different execution than the one you asked about", so the
      second log looks like better evidence while being evidence about
      something else. `DEBUG=*` enables no logger this program has, and
      nothing throws, so no stack trace is produced by either run.
    command: ["diff", "$RUN", "$RUN2"]
    expect_exit: 1
    expect_contains: ["at causal step 4:"]
    expect_line:
      - ["A:", "CALL    left"]
      - ["B:", "CALL    right"]
    expect_absent: ["verdict: MATCH", "REFUSED"]
  - id: does-anything-link-the-two-runs
    ask: >
      Of the traces now in this store, does anything claim that one is a
      re-run of the other?
    truth: >
      Nothing does. They are two separate INVOCATIONS -- two headers, each
      with its own harness exit of 0 -- and each holds exactly one trace of
      the same test file. No `refocus-of:` link and no verdict is stamped
      on either, because this recorder declares `refocus: false` and never
      re-ran anything; the relationship between the two runs is the
      reader's inference and the store says nothing to support it.
    why_logs_fail: >
      This is a question about the provenance of recorded evidence, which a
      program cannot print about itself: two runs of one command produce two
      identical-looking logs, and nothing in either says which came first or
      whether one was meant to explain the other. It matters because it is
      what stops a second run from later passing itself off as a
      reproduction once the terminal has scrolled.
    command: ["runs"]
    expect_count:
      "npx vitest run nondeterministic  exit:0 (waited)": 2
      "file: nondeterministic/nondeterministic.test.ts": 2
    expect_absent: ["refocus-of:", "verdict:"]
