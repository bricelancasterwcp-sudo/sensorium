program: vitest
harness_args: ["run", "focus_catch_binding/"]
record: {focus: ["retry.ts:attempts"]}
questions:
  - id: what-was-the-reason-the-counter-swallowed
    ask: >
      The counter says one key failed. What was the reason, and how long did
      the recording hold it?
    truth: >
      `Error: bad key: oops`, held for exactly one statement. The catch
      clause's entry mints a row like any other guarded body -- `LINE
      attempts L17  e=Error: bad key: oops`, at the line of the `catch` --
      and the statement inside it mints `count=1` at L18. Then the `try`
      statement's own row, at L15, carries `unbound:e`: the binding ends with
      the clause, and the recorder says so at the statement that ended it
      rather than by falling silent. It says so TWICE, once per iteration,
      including the pass where nothing was thrown.
    why_logs_fail: >
      A `console.log(e)` inside the clause is the edit the program's author
      deliberately did not make, which is what makes this a swallow; adding
      it after the fact means re-running, and the reason belongs to a run
      that already happened. `DEBUG=*` cannot reach a catch binding. A stack
      trace exists only for a throw that got out, and this one did not --
      the `catch` is where it stopped.
    command: ["frame", "$RUN", "--fn", "attempts"]
    expect_exit: 0
    expect_contains:
      - "args: keys=[ 'k-1', 'oops' ]"
      - "return: 1"
    expect_line:
      - ["LINE", "attempts L17", "e=Error: bad key: oops"]
      - ["LINE", "attempts L18", "count=1"]
      - ["LINE", "attempts L15", "unbound:e"]
      - ["LINE", "attempts L14", "unbound:key"]
    expect_count:
      "unbound:e": 2
  - id: did-anything-record-the-catch-itself
    ask: >
      Is the `catch` itself an event, or only the counter it wrote?
    truth: >
      It is an event of its own, and this recorder's verdict on it is
      SWALLOWED: the `catch` absorbed the error -- it neither rethrows nor
      logs -- and the frame holding it, `attempts`, returned normally once
      the loop ended. That is sensorium's `swallowed` disposition (design
      R7/R8, `exceptions_typescript.py`'s own rule), which is what a silent
      `catch` IS, not a milder relative of it. `grep --kind HANDLED` names
      the same event under its own vocabulary -- `HANDLED attempts handled
      Error('bad key: oops') L17` -- but attribution and disposition are two
      different questions, and this one is the disposition: the table row
      E6-TS″ pre-registers for this case (**1** SWALLOWED, no reason line)
      is what the instrument reads this answer against.
    why_logs_fail: >
      An empty-ish `catch` prints nothing by definition, so `console.log` has
      no line to be on, and a grep of the source for `catch` finds the clause
      without telling you whether it ever ran or how often. `DEBUG=*` prints
      what the program chose to print, which here is nothing. A stack trace
      is produced for a throw that escapes; this one was caught, so the
      channel that would have named it never fires.
    command: ["exceptions", "$RUN"]
    expect_exit: 0
    expect_line:
      - ["SWALLOWED -- caught by catch at e12 (attempts L17) in f2, which
          returned"]
      - ["dispositions: swallowed 1"]
