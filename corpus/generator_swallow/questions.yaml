program: main.py
questions:
  - id: did-the-generator-eat-them
    ask: >
      Two of the five readings could not be parsed. Were errors raised and
      discarded inside the parser, and can I trust an answer that says so?
    truth: >
      Yes to both. Two ValueErrors were raised inside parse_all -- for 'n/a'
      and '--' -- and each has a HANDLED row at line 25. parse_all is a
      GENERATOR, and a generator body opens a frame like any other traced
      code object: that frame closed by RETURNING, which is what SWALLOWED
      requires, so each raise is reported as swallowed in the frame that
      caught it, and the tally reads `swallowed 2`.

      The evidence named in the verdict is what makes it more than a guess:
      the handler is in f3, f3 returned normally, and neither exception was
      raised again afterwards. Until 0.3.0 this same case was registered the
      other way, as `ambiguous 2`, because a frameless handler could never
      satisfy that rule -- so this question is registered to go red if the
      withheld verdict ever comes back for a frame that plainly returned.
      The under-claim still has a case of its own; it is `suspended_handler`,
      where the frame never closes.
    why_logs_fail: >
      The except clause prints nothing, so two failures leave no mark on
      stdout at all: the mean and the count both look ordinary. A log line
      in the handler would surface them, and is the change nobody makes
      before the numbers look wrong. But no log can supply the second half
      of the answer -- whether the handler kept the exception or let it out
      again -- because that is decided by what happened to the frame after
      the handler ran, and no line inside the handler is in a position to
      report on its own frame's ending.
    command: ["exceptions", "$RUN"]
    expect_contains: ["dispositions: swallowed 2"]
    expect_line:
      - ["RAISE", "parse_all", "ValueError", "'n/a'"]
      - ["RAISE", "parse_all", "ValueError", "'--'"]
      - ["SWALLOWED at e", "parse_all", "L25", "which returned normally"]
    expect_count: {"SWALLOWED": 2}
    # The wording of the arc-1 under-claim, in both its halves. Either one
    # appearing here means a frame that returned had its verdict withheld.
    expect_absent:
      - "no frame recorded"
      - "ambiguous"
