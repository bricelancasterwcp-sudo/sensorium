name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every version's result; one red leg must not cancel the others.
      fail-fast: false
      matrix:
        # 3.12 is the floor (sys.monitoring); 3.14 is where a multiprocessing
        # spawn becomes witnessable, so refocus's child-witnessing licence
        # behaves differently across the range and all three are exercised.
        python-version: ["3.12", "3.13", "3.14"]
    name: py${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the acceptance byte-lock tests read §1 at its lock
          # commit (`git show <sha>:<doc>`); a depth-1 checkout cannot, and
          # the tests then skip BY NAME instead of passing vacuously.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (stdlib-only runtime; dev extras for the test tools)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Tests
        # tests/test_rust_convert.py is in here too: with no
        # SENSORIUM_CARGO_SENSORIUM set on this matrix, it skips itself BY
        # NAME (pytest.mark.skipif with a reason) rather than needing this
        # job to know to exclude it.
        run: python -m pytest -q
      - name: Corpus (seeded-bug regression suite)
        # corpus/rust and corpus/typescript are in here too: with no
        # SENSORIUM_CARGO_SENSORIUM set on this matrix and no
        # cargo-sensorium on PATH, the Rust cases are reported skipped BY
        # NAME in the summary rather than passed; with no `npm ci` run in
        # corpus/typescript (this matrix installs no Node dependencies at
        # all), the TypeScript cases are skipped BY NAME the same way. The
        # Python cases still run. So no --require-driver here: the skip is
        # this matrix's correct outcome. The `rust` and `typescript` jobs
        # below are where those cases are recorded, and where the flag
        # turns a skip into a failure.
        run: python corpus/run_corpus.py

  rust:
    runs-on: ubuntu-latest
    name: rust
    env:
      # The default `rust/target`, named explicitly rather than left to
      # cargo's own default -- never a path under /mnt/extra or any other
      # box-specific location (this workflow must be portable to any runner).
      CARGO_TARGET_DIR: ${{ github.workspace }}/rust/target
      # rust/rust-toolchain.toml (read above by `rustup show`) only pins
      # builds run from inside rust/, or a descendant of it: rustup finds
      # the file by walking up from the current directory. The corpus's
      # Rust fixtures (corpus/rust/*/Cargo.toml) are compiled by the driver
      # in temp dirs OUTSIDE rust/, where that file is not an ancestor, so
      # without this line they would build under whatever toolchain is
      # ubuntu-latest's default. This variable is honoured by rustup for
      # every cargo invocation in this job's environment regardless of
      # working directory, so it pins those fixture builds too.
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the acceptance byte-lock tests read §1 at its lock
          # commit (`git show <sha>:<doc>`); a depth-1 checkout cannot, and
          # the tests then skip BY NAME instead of passing vacuously.
          fetch-depth: 0
      # The job-level RUSTUP_TOOLCHAIN above outranks rust-toolchain.toml
      # (rustup's precedence: env var beats the file), so on a fresh runner
      # `rustup show` would install 1.96.0 through the env-var route, which
      # carries no component list -- rustfmt/clippy would NOT come along,
      # even though the file names them. rust-toolchain.toml still matters
      # for local developers, who don't set this env var and so pick up the
      # file (and its components) the normal way; here in CI, where the env
      # var is set, the components have to be requested explicitly.
      - name: Rust toolchain (pinned; components installed explicitly)
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            rust/target
          key: ${{ runner.os }}-cargo-1.96.0-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.96.0-
      - name: Build the driver (release)
        working-directory: rust
        run: cargo build --release -p cargo-sensorium
      - name: cargo test --workspace
        working-directory: rust
        run: cargo test --workspace
      # HONESTY §4 names the synthetic disk-full arm as THE falsifier of
      # `records_dropped`, and `durability.rs` gates it on `test-hooks` -- so
      # the line above compiles it out. Same target directory as every other
      # step here: the feature adds one `env::var` read to `spool_limit()`, so
      # this is a recompile of sensorium-rt and its tests, not of the world.
      - name: cargo test -p sensorium-rt --features test-hooks
        working-directory: rust
        run: cargo test -p sensorium-rt --features test-hooks
      - name: cargo fmt --check
        working-directory: rust
        run: cargo fmt --all -- --check
      - name: cargo clippy
        working-directory: rust
        run: cargo clippy --workspace --all-targets -- -D warnings
      # mechanics.sh builds its own driver copy under the same
      # CARGO_TARGET_DIR, so this is a `Fresh` no-op build, not a second
      # compile. SENSORIUM_PROBE_TARGET is intentionally unset: the probe
      # builds into the default rust/probes/ws/target, and the
      # different-filesystem check skips itself BY NAME, exactly as it does
      # off-CI.
      - name: Rust mechanics (probe workspace)
        run: bash rust/tests/mechanics.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (dev extras for the test tools)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      # test_focus_refusal.py rides along here for the same reason: it needs
      # a driver to invoke, and this is the only job that has one. It builds
      # into a subdirectory of the job's CARGO_TARGET_DIR and removes it
      # again; without a driver it would skip BY NAME, and a gate that only
      # ever skips is not a gate.
      - name: Cross-recorder conformance (Rust fixtures through the real CLI)
        env:
          SENSORIUM_CARGO_SENSORIUM: ${{ github.workspace }}/rust/target/release/cargo-sensorium
        run: python -m pytest -q tests/test_rust_convert.py tests/test_focus_refusal.py
      # --only-dir rust: this job records corpus/rust alone, not the whole
      # corpus. The Python cases already ran in the `test` matrix above and
      # gain nothing from a second recording here, and the TypeScript cases
      # are the `typescript` job's -- this job installs no Node dependency
      # at all, so without --only-dir they would be reported skipped BY
      # NAME rather than excluded, and --require-driver would then fail a
      # job that never had a TypeScript driver to be missing. CARGO_TARGET_DIR
      # is the job's `rust/target` (above), so the corpus crates share one
      # warm target directory and the runtime rlib is built once.
      # `--require-driver` is what makes this a gate: the driver is built
      # two steps up, so a skip here means it went missing, and without the
      # flag that would be a green job over cases nobody ran.
      - name: Rust corpus (records corpus/rust with the built driver)
        env:
          SENSORIUM_CARGO_SENSORIUM: ${{ github.workspace }}/rust/target/release/cargo-sensorium
        run: python corpus/run_corpus.py --only-dir rust --require-driver

  typescript:
    runs-on: ubuntu-latest
    name: typescript
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the acceptance byte-lock tests read §1 at its lock
          # commit (`git show <sha>:<doc>`); a depth-1 checkout cannot, and
          # the tests then skip BY NAME instead of passing vacuously.
          fetch-depth: 0
      # typescript/package.json pins `"engines": {"node": ">=24"}` -- the
      # recorder relies on node:async_hooks and node:test surfaces measured
      # at that floor -- so this is the version everything below is built
      # and tested against, not whatever ubuntu-latest ships by default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Three lock files, because there are three separate npm projects in
      # play (typescript/ the library, typescript/probes/ the recorder
      # recording itself, corpus/typescript/ the vitest project the corpus
      # copies into): each pins its own dependency tree, and `hashFiles` on
      # all three means a change to any one of them invalidates the cache
      # rather than serving a stale install of a project nobody touched.
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('typescript/package-lock.json', 'typescript/probes/package-lock.json', 'corpus/typescript/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
      # `npm ci`, not `npm install`: it reproduces the lock file exactly
      # rather than resolving fresh, which matters most for probes/ and
      # corpus/typescript/ -- both pin vitest and vite WITHOUT a caret
      # (probes/README.md) because the acceptance lens is a version, and a
      # floating range would silently re-lens every number these projects
      # produce.
      - name: Install typescript/
        run: npm ci --prefix typescript
      - name: Install typescript/probes/
        run: npm ci --prefix typescript/probes
      # corpus/typescript/ is the vitest project the thirteen corpus cases
      # live inside. `run_corpus.py`'s `_copy_ts_project` SYMLINKS this
      # node_modules into each case's disposable copy rather than copying
      # it -- an installed vitest is hundreds of megabytes and thirteen
      # copies would dominate the run -- so it has to exist, installed once,
      # before the corpus step below ever runs.
      - name: Install corpus/typescript/
        run: npm ci --prefix corpus/typescript
      # R4: `npm --prefix typescript run check`, never
      # `npx tsc -p typescript/tsconfig.json` run from the repo root. The
      # repo root has no node_modules of its own, so a bare `npx tsc` there
      # does not resolve the pinned 5.9.3 sitting in typescript/node_modules
      # -- it resolves (or fetches) some OTHER `typescript` package instead,
      # a decoy that would type-check this project with a compiler nobody
      # develops against. `npm --prefix typescript run check` runs the
      # `check` script FROM INSIDE typescript/, where `tsc` resolves the
      # pinned local install the way `npm test` and every contributor's own
      # `npm run check` already do.
      - name: Type-check (npm --prefix typescript run check)
        run: npm --prefix typescript run check
      # `node --test "test/**/*.test.mjs"`, the recorder's own unit tests --
      # rt.mjs, transform.mjs, register.mjs and friends -- with nothing
      # driven and no vitest involved. A failure here means the library
      # itself is broken before either probe project ever runs it.
      - name: Unit tests (npm --prefix typescript test)
        run: npm --prefix typescript test
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install (dev extras for the test tools)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      # SENSORIUM_TS_LIVE=1 is what stops tests/test_ts_live.py skipping BY
      # NAME: it is the only test that puts the whole recorder together --
      # the wrapper config in front of a consumer's own config, a real
      # vitest, forked containers, conversion and the reader -- against
      # typescript/probes, which was just `npm ci`'d above. Without a Node
      # this old, or without that install, it is the ordinary state of every
      # OTHER job in this workflow and skips by name there; here it is the
      # gate that the whole chain works on a fresh machine, so a skip would
      # hide exactly the failure this job exists to catch.
      # test_ts_driver.py rides along for the same reason on the `node
      # --test` half of the recorder (it needs Node >= 24 and
      # typescript/node_modules/magic-string, both true here) and skips BY
      # NAME rather than under this flag when they are not -- it is not
      # gated on SENSORIUM_TS_LIVE, but it would silently skip on any job
      # that had not run `npm ci --prefix typescript` above.
      # test_ts_ingest*.py, test_ts_spool.py, test_ts_refusal.py,
      # test_ts_harness.py, test_ts_wrapper.py, test_vectors.py and
      # test_vocab.py are the rest of the TypeScript-recorder suite that
      # needs this same Node and this same install; none of them has
      # anywhere else in this workflow to run. test_ts_spool.py joins the
      # list on the same symmetry argument that put test_ts_ingest_
      # refusals.py here (the Task 7 ruling in the slice's SDD ledger):
      # the matrix jobs' bare `pytest -q` already runs it, and a list
      # that names its siblings and not it reads as a deliberate
      # omission.
      - name: TypeScript recorder tests (through a real Node and a real vitest)
        env:
          SENSORIUM_TS_LIVE: "1"
        run: python -m pytest -q tests/test_ts_live.py tests/test_ts_driver.py tests/test_ts_ingest.py tests/test_ts_ingest_meta.py tests/test_ts_ingest_refusals.py tests/test_ts_spool.py tests/test_ts_refusal.py tests/test_ts_harness.py tests/test_ts_wrapper.py tests/test_vectors.py tests/test_vocab.py
      # --only-dir typescript, mirroring the `rust` job above: this records
      # corpus/typescript alone, and --require-driver is what makes that a
      # gate rather than a green job over cases nobody ran. `ts_ready()`
      # needs corpus/typescript/node_modules/vitest (installed above) and a
      # Node at or above the recorder's floor (node 24, installed above);
      # if either went missing between here and the steps above, the
      # thirteen vitest cases would otherwise be reported skipped BY NAME
      # and this job would still exit 0 -- which is precisely the outcome
      # this flag exists to turn into a failure.
      - name: TypeScript corpus (records corpus/typescript with the real driver)
        run: python corpus/run_corpus.py --only-dir typescript --require-driver
