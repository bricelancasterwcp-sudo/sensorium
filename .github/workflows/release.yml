# Publish sensorium-trace to PyPI (Trusted Publishing) and to npm,
# publish the Rust crates to crates.io, and attach prebuilt
# cargo-sensorium binaries to the GitHub Release for a v* tag.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the Python sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify the pack contents
        working-directory: typescript
        run: npm pack --dry-run

      - name: Publish to npm
        working-directory: typescript
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  crates:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Publish crates in dependency order
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # crates.io rejects the default curl User-Agent.
          ua="sensorium-release (https://github.com/bricelancasterwcp-sudo/sensorium)"
          crate_version() {
            sed -n 's/^version = "\(.*\)"/\1/p' "$1/Cargo.toml" | head -1
          }
          already_published() {
            local crate="$1" ver="$2" code
            code=$(curl -sS -A "$ua" -o /dev/null -w "%{http_code}" \
              "https://crates.io/api/v1/crates/${crate}/${ver}")
            case "$code" in
              200) return 0 ;;
              404) return 1 ;;
              *) echo "crates.io lookup for ${crate} ${ver} returned HTTP ${code}" >&2; exit 1 ;;
            esac
          }
          publish_one() {
            local crate="$1" ver n
            ver=$(crate_version "$crate")
            if already_published "$crate" "$ver"; then
              echo "${crate} ${ver} already on crates.io; skipping"
              return 0
            fi
            echo "publishing ${crate} ${ver}"
            n=0
            while :; do
              n=$((n + 1))
              if cargo publish -p "$crate" --locked --no-verify; then
                return 0
              fi
              if [ "$n" -ge 8 ]; then
                echo "giving up on ${crate} ${ver} after ${n} attempts" >&2
                return 1
              fi
              echo "publish of ${crate} failed (attempt ${n}); waiting for the crates.io index"
              sleep 20
            done
          }
          publish_one sensorium-rt
          publish_one sensorium-transform
          publish_one cargo-sensorium

  binaries:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup toolchain install 1.96.0 --profile minimal

      - name: Build cargo-sensorium (release)
        working-directory: rust
        run: cargo build --release -p cargo-sensorium --locked

      - name: Pack tarball and sha256
        working-directory: rust
        run: |
          set -euo pipefail
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' cargo-sensorium/Cargo.toml | head -1)
          # The runtime is Linux-only (MAP_SHARED, gettid). This job runs on
          # ubuntu-latest, which is x86_64; aarch64, macOS and Windows are not
          # built. lib.rs refuses to compile on a non-Linux target.
          target=x86_64-unknown-linux-gnu
          name="cargo-sensorium-${ver}-${target}"
          stage=$(mktemp -d)
          mkdir -p "${stage}/${name}"
          cp target/release/cargo-sensorium "${stage}/${name}/"
          cp cargo-sensorium/README.md "${stage}/${name}/"
          mkdir -p dist
          tar -C "$stage" -czf "dist/${name}.tar.gz" "$name"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          ls -l dist

      - name: Attach to GitHub Release
        working-directory: rust
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          notes='Prebuilt cargo-sensorium for Linux x86_64.

          The recorder is Linux-only (MAP_SHARED, gettid). macOS and Windows binaries are not produced.

          Install from crates.io: `cargo install cargo-sensorium`'
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.tar.gz dist/*.sha256 --clobber
          else
            gh release create "$tag" dist/*.tar.gz dist/*.sha256 --title "$tag" --notes "$notes"
          fi
