# Publishing is intentionally not a step. This workflow builds a Python
# sdist and wheel and packs the Node package, then uploads those artifacts.

name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# Artifact upload needs actions: write. contents stays read so this job
# cannot push.
permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build the Python sdist and wheel
        run: |
          python -m pip install build
          python -m build

      - name: Pack the Node package into a temp directory
        working-directory: typescript
        run: |
          dest="${RUNNER_TEMP}/sensorium-trace-npm"
          mkdir -p "$dest"
          npm pack --pack-destination "$dest"
          cp "$dest"/*.tgz "${GITHUB_WORKSPACE}/dist/"

      - name: Upload built artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sensorium-trace-packages
          path: dist/
          if-no-files-found: error
