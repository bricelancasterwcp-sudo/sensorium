[project]
name = "sensorium-trace"
version = "0.18.2"
description = "Execution-trace recorder for Python programs, driver and converter for the TypeScript and C recorders, and the LLM-native query CLI that reads every sensorium trace: Python's, the Rust recorder's, the TypeScript recorder's and the C recorder's alike"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "bricelancasterwcp-sudo" }]
keywords = ["tracing", "debugging", "testing", "execution-trace"]
dependencies = []

[project.urls]
Homepage = "https://github.com/bricelancasterwcp-sudo/sensorium"
Repository = "https://github.com/bricelancasterwcp-sudo/sensorium"

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "pytest-cov>=5", "pyelftools>=0.31"]
# The official MCP Python SDK, installed for ONE test file
# (`tests/test_mcp_conformance.py`) and never imported under `src/`:
# it is the conformance oracle for `sensorium mcp`, the one client
# that cannot share our reading of the protocol. Its own dependency
# tree is large (pydantic, anyio, starlette, httpx, ...), which is
# exactly why it is a separate extra from `dev` rather than part of
# it: every other job installs `.[dev]` alone, and the test file
# skips itself BY NAME there. Pinned to the 2.x major -- the SDK's
# 2.x line is the one that speaks 2026-07-28's per-request envelope.
conformance = ["mcp>=2.2,<3"]

[project.scripts]
sensorium = "sensorium.cli:main"
sensorium-cc = "sensorium.c.cc:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Skip directories the root .gitignore excludes (`target/`, `node_modules/`)
# instead of walking them. A probe build is hundreds of megabytes of
# absolute symlinks, and one of those in the sdist is a tarball pip rejects.
[tool.hatch.build]
skip-excluded-dirs = true

[tool.hatch.build.targets.wheel]
packages = ["src/sensorium"]
# The Node recorder. Not a Python package, so `packages` does not ship it,
# and a git+https install otherwise has nowhere for `sensorium ts` to find
# it. `node_modules` stays out: it is gitignored, and `check` tells the
# user to `npm ci --prefix` the directory the wheel laid down.
[tool.hatch.build.targets.wheel.force-include]
"typescript/package.json" = "sensorium/_typescript/package.json"
"typescript/package-lock.json" = "sensorium/_typescript/package-lock.json"
"typescript/src" = "sensorium/_typescript/src"
# The C runtime source. Not a Python package. A wheel lays it where
# `sensorium c` can compile against it without the checkout.
"c/rt/sensorium_c_rt.c" = "sensorium/_c/rt/sensorium_c_rt.c"

# The same files in the sdist, so a wheel built from the sdist (not only
# from a git checkout) can still copy them. Paths stay `typescript/...`:
# the wheel mapping above reads them from the project root.
[tool.hatch.build.targets.sdist.force-include]
"typescript/package.json" = "typescript/package.json"
"typescript/package-lock.json" = "typescript/package-lock.json"
"typescript/src" = "typescript/src"
# Same file, still at its source path, so a wheel built from this sdist
# can apply the mapping above. pkg.py also walks up to c/rt/.
"c/rt/sensorium_c_rt.c" = "c/rt/sensorium_c_rt.c"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
