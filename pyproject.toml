[project]
name = "sensorium"
version = "0.9.1"
description = "Execution-trace recorder for Python programs, and the LLM-native query CLI that reads every sensorium trace — Python's, the Rust recorder's and the TypeScript recorder's alike"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pyyaml>=6", "pytest-cov>=5"]

[project.scripts]
sensorium = "sensorium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sensorium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
